{% extends 'base.html' %}
{% block title %}{{ 'Editar' if reservation else 'Nova' }} reserva | Agenda Escolar{% endblock %}
{% block content %}
<section class="card">
    <h2>{{ 'Editar reserva' if reservation else 'Nova reserva' }}</h2>
    <form method="post" class="grid-form two-cols">        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Tipo de recurso
            <select name="resource_type" id="resource_type" required>
                <option value="">Selecione</option>
                <option value="sala" {{ 'selected' if reservation and reservation['recurso_tipo'] == 'sala' else '' }}>Sala</option>
                <option value="equipamento" {{ 'selected' if reservation and reservation['recurso_tipo'] == 'equipamento' else '' }}>Equipamento</option>
            </select>
        </label>

        <label>Recurso
            <select name="resource_id" required>
                {% for room in rooms %}
                    <option value="{{ room['id'] }}" data-type="sala" {{ 'selected' if reservation and reservation['recurso_tipo'] == 'sala' and reservation['recurso_id'] == room['id'] else '' }}>
                        Sala: {{ room['nome'] }}
                    </option>
                {% endfor %}
                {% for eq in equipments %}
                    <option value="{{ eq['id'] }}" data-type="equipamento" {{ 'selected' if reservation and reservation['recurso_tipo'] == 'equipamento' and reservation['recurso_id'] == eq['id'] else '' }}>
                        Equipamento: {{ eq['nome'] }}
                    </option>
                {% endfor %}
            </select>
        </label>

        <label>Data
            <input type="date" name="date" required value="{{ reservation['data'] if reservation else '' }}">
        </label>
        <label>Horário inicial
            <input type="time" name="start_time" required value="{{ reservation['horario_inicio'] if reservation else '' }}">
        </label>
        <label>Horário final
            <input type="time" name="end_time" required value="{{ reservation['horario_fim'] if reservation else '' }}">
        </label>
        <label class="full">Observação
            <textarea name="observacao" rows="3" placeholder="Ex: trazer cabo HDMI">{{ reservation['observacao'] if reservation else '' }}</textarea>
        </label>

        <div class="full actions">
            <button type="submit">{{ 'Salvar alterações' if reservation else 'Criar reserva' }}</button>
            <a class="btn-secondary" href="{{ url_for('main.agenda') }}">Voltar</a>
        </div>
    </form>
</section>

<script>
(function () {
    const typeSelect = document.getElementById('resource_type');
    const resourceSelect = document.querySelector('select[name="resource_id"]');

    function filterResources() {
        const selectedType = typeSelect.value;
        const options = Array.from(resourceSelect.options);
        options.forEach((option) => {
            option.hidden = selectedType && option.dataset.type !== selectedType;
        });

        if (selectedType) {
            const firstVisible = options.find((opt) => !opt.hidden);
            if (firstVisible) {
                firstVisible.selected = true;
            }
        }
    }

    typeSelect.addEventListener('change', filterResources);
    filterResources();
})();
</script>
{% endblock %}
