{% extends 'base.html' %}
{% block title %}Login | Agenda Escolar{% endblock %}
{% block content %}
<section class="card auth-card">
    <h2>Entrar no sistema</h2>
    <p>Use sua conta para acessar a agenda escolar.</p>
    <form method="post" class="grid-form">        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Senha
            <input type="password" name="password" required>
        </label>
        <button type="submit">Entrar</button>
    </form>
    <small>Admin inicial: admin@escola.local / admin123</small>
</section>
{% endblock %}
