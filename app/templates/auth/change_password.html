{% extends 'base.html' %}
{% block title %}Alterar Senha | Agenda Escolar{% endblock %}
{% block content %}
<section class="card auth-card">
    <h2>Alterar senha</h2>
    <p>Para segurança, defina uma nova senha forte.</p>
    <form method="post" class="grid-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Senha atual
            <input type="password" name="senha_atual" required>
        </label>
        <label>Nova senha
            <input type="password" name="nova_senha" required placeholder="8+ chars, A-z, 0-9, símbolo">
        </label>
        <label>Confirmar nova senha
            <input type="password" name="confirmar_senha" required>
        </label>
        <button type="submit">Salvar nova senha</button>
    </form>
</section>
{% endblock %}
