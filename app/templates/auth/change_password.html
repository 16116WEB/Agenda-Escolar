{% extends 'base.html' %}
{% block title %}Alterar Senha | Agenda Escolar{% endblock %}
{% block content %}
<section class="card auth-card">
    <h2>🔑 Alterar senha</h2>
    <p class="muted" style="margin:0 0 24px;">Para sua segurança, defina uma nova senha forte.</p>
    <form method="post" class="grid-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Senha atual
            <div class="input-icon-wrap">
                <span class="icon">🔒</span>
                <input type="password" name="senha_atual" required placeholder="••••••••">
            </div>
        </label>
        <label>Nova senha
            <div class="input-icon-wrap">
                <span class="icon">✨</span>
                <input type="password" name="nova_senha" required placeholder="8+ chars, A-z, 0-9, símbolo">
            </div>
        </label>
        <label>Confirmar nova senha
            <div class="input-icon-wrap">
                <span class="icon">✅</span>
                <input type="password" name="confirmar_senha" required placeholder="Repita a nova senha">
            </div>
        </label>
        <div class="actions">
            <button type="submit">Salvar nova senha</button>
            <a class="btn-secondary" href="{{ url_for('main.dashboard') }}">← Voltar</a>
        </div>
    </form>
</section>
{% endblock %}
